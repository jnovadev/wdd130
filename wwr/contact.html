<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapid River Rafting for trip details, reservation questions, and suggestions. Find our contact information and send a message to our team.">
    <meta name="author" content="Jonathan Reyes Novoa">
    <title>Contact Us | Rapid River Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/rapid-river-logo.png" alt="Rapid River Rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" aria-current="page">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="contact-info">
            <h1>Contact Rapid River Rafting</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </div>

        <div class="contact-grid">
            <iframe class="contact-map"
              src="https://www.google.com/maps?q=California%2C%20USA&amp;z=6&amp;output=embed"
              title="Google map of California" width="400" height="450" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>

            <form class="contact-form" action="contact.html" method="get">
                <h2>Send Us a Message</h2>
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label class="choice" for="general-inquiry">
                        <input type="radio" id="general-inquiry" name="purpose"
                          value="general-inquiry" required>
                        General Inquiry
                    </label>
                    <label class="choice" for="reservation-question">
                        <input type="radio" id="reservation-question" name="purpose"
                          value="reservation-question">
                        Reservation Question
                    </label>
                    <label class="choice" for="website-suggestion">
                        <input type="radio" id="website-suggestion" name="purpose"
                          value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="message-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <label class="choice" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee-guide.jpg" alt="Portrait of Daniel, our head river guide"
                      width="320" height="320" loading="lazy">
                    <figcaption>Daniel Carter<span>Head River Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee-reservations.jpg"
                      alt="Portrait of Emma, our reservations coordinator" width="320" height="320"
                      loading="lazy">
                    <figcaption>Emma Wilson<span>Reservations Coordinator</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee-manager.jpg"
                      alt="Portrait of James, our operations manager" width="320" height="320"
                      loading="lazy">
                    <figcaption>James Miller<span>Operations Manager</span></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Rapid River Rafting | Jonathan Reyes</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram icon">
            </a>
        </nav>
    </footer>
</body>

</html>
